# Include inside the HTTPS-facing n8n nginx server block.
# A reverse SSH tunnel binds the MacBook backend to server loopback port 14000.
# Only service-authenticated workflow callbacks are exposed by this bridge.
location ~ ^/ig-flow-api(/api/jobs/[0-9a-fA-F-]+/(claim|manifest|result|failure))$ {
    rewrite ^/ig-flow-api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:14000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;
}
location /ig-flow-api/ { return 404; }
