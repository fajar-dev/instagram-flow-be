openapi: 3.0.0
info:
  title: IG Flow API
  description: >-
    API for AMTI IG Flow content preparation, AI processing, and internal review.
    Language is detected from the `Accept-Language` header (`en` default, `id` supported)
    and echoed back via the `Content-Language` response header on every response.
  version: 2.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development server
  - url: /api
    description: Relative API server

tags:
  - name: Instagram
  - name: Publishing
  - name: Content
  - name: AI Jobs
  - name: Content Drafts
  - name: Reporting
  - name: Integration
  - name: Auth
    description: Login, session, and password management for existing accounts
  - name: User
    description: User management for authenticated active users
  - name: Upload
    description: File upload & retrieval via MinIO object storage

components:
  securitySchemes:
    n8nServiceAuth:
      type: http
      scheme: bearer
      description: N8N_BACKEND_SERVICE_TOKEN (distinct from JWT)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token. Expires in 15 minutes."

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Preferred response language. Supported: `en` (default), `id`.
        Missing or unsupported values fall back to `en`.
      schema:
        type: string
        enum: [en, id]
        default: en
      example: id

  headers:
    ContentLanguage:
      description: Resolved response language (`en` or `id`), echoed back from `Accept-Language`.
      schema:
        type: string
        enum: [en, id]

  schemas:
    InsightReport:
      type: object
      required: [metrics, fetchedAt, engagementRate]
      properties:
        range:
          type: object
          description: Account period bounds as Unix seconds in Asia/Jakarta calendar boundaries.
          properties:
            since:
              type: integer
            until:
              type: integer
        previous:
          description: Account-only comparison for the elapsed portion of the preceding period; includes metrics, engagementRate, range and fetchedAt.
          $ref: '#/components/schemas/InsightReport'
        engagementRate:
          type: number
          nullable: true
          description: Total interactions divided by reach times 100; null if reach is zero/missing or interactions missing. May exceed 100.
        fetchedAt:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: number
                nullable: true
                description: Null means unavailable, not zero.
        media:
          $ref: '#/components/schemas/AnalyticsMedia'
    AnalyticsMedia:
      type: object
      properties:
        id:
          type: string
        caption:
          type: string
        type:
          type: string
        product:
          type: string
        timestamp:
          type: string
        permalink:
          type: string
          nullable: true
    InstagramAccount:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        instagramUserId:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        expired:
          type: boolean
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
    PublishContent:
      type: object
      additionalProperties: false
      required: [title, caption, hashtags, location, activity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        caption:
          type: string
          minLength: 1
          maxLength: 10000
        hashtags:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 100
        location:
          type: string
          minLength: 1
          maxLength: 200
        activity:
          type: string
          minLength: 1
          maxLength: 200
    StoryContent:
      type: object
      additionalProperties: false
      required: [title, caption, hashtags, location, activity]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        caption:
          type: string
          enum: [""]
        hashtags:
          type: array
          maxItems: 0
          items:
            type: string
            maxLength: 100
        location:
          type: string
          minLength: 1
          maxLength: 200
        activity:
          type: string
          minLength: 1
          maxLength: 200
    PublicationInput:
      description: Placement must match the job output. Feed includes caption and hashtags; Story requires both empty.
      oneOf:
        - $ref: '#/components/schemas/FeedPublicationInput'
        - $ref: '#/components/schemas/StoryPublicationInput'
      discriminator:
        propertyName: placement
        mapping:
          feed: '#/components/schemas/FeedPublicationInput'
          story: '#/components/schemas/StoryPublicationInput'
    FeedPublicationInput:
      type: object
      required:
        - expectedContentHash
        - content
        - accountKey
        - renderIds
        - placement
        - scheduledAt
      properties:
        expectedContentHash:
          type: string
          minLength: 64
          maxLength: 64
        content:
          $ref: '#/components/schemas/PublishContent'
        accountKey:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
        renderIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: Edited render IDs from this job, in Instagram slide order.
          items:
            type: string
            format: uuid
        placement:
          type: string
          enum: [feed]
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Null for immediate queueing; otherwise at least one minute ahead.
            Immutable publication snapshot.
    StoryPublicationInput:
      type: object
      required:
        - expectedContentHash
        - content
        - accountKey
        - renderIds
        - placement
        - scheduledAt
      properties:
        expectedContentHash:
          type: string
          minLength: 64
          maxLength: 64
        content:
          $ref: '#/components/schemas/StoryContent'
        accountKey:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
        renderIds:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          description: Edited render IDs from this job, in Instagram slide order.
          items:
            type: string
            format: uuid
        placement:
          type: string
          enum: [story]
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Null for immediate queueing; otherwise at least one minute ahead.
            Immutable publication snapshot.
    Publication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        draftId:
          type: string
          format: uuid
        accountKey:
          type: string
        accountLabel:
          type: string
        caption:
          type: string
        imageCount:
          type: integer
          minimum: 1
          maximum: 10
        renderIds:
          type: array
          items:
            type: string
            format: uuid
        placement:
          type: string
          enum:
            - feed
            - story
        status:
          type: string
          enum:
            - QUEUED
            - SCHEDULED
            - PROCESSING
            - PUBLISHING
            - PUBLISHED
            - FAILED
            - UNKNOWN
            - CANCELLED
        scheduledAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        mediaId:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        safeError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    # --- Base Wrapper Schemas ---
    BaseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string, example: "Operation successful" }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 400 }
        message: { type: string, example: "Something went wrong" }
        errors: { type: object, nullable: true, example: null }

    ValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 422 }
        message: { type: string, example: "Validation failed" }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: "email" }
              message: { type: string, example: "Invalid email format" }

    # --- Auth Schemas ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "budi@example.com" }
        password: { type: string, example: "secret123" }

    GoogleLoginRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, example: "4/0AX4XfWh..." }

    MicrosoftLoginRequest:
      type: object
      required: [code, codeVerifier]
      properties:
        code: { type: string, example: "M.R3_BAY.0..." }
        codeVerifier: { type: string, minLength: 43, maxLength: 128, description: "PKCE verifier retained by the login popup opener" }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: "budi@example.com" }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, example: "a3f8c2d1e9b4..." }
        newPassword: { type: string, minLength: 6, example: "newSecret123" }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }

    # --- Auth User Schema (response shape from AuthSerializer) ---
    AuthUser:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Budi Santoso" }
        photo: { type: string, nullable: true, example: "https://cdn.example.com/photo.jpg" }
        email: { type: string, format: email, example: "budi@example.com" }
        isActive: { type: boolean, example: true }
        hasPassword:
          type: boolean
          description: Whether the account has a password set (false for Google-only accounts)
          example: true

    ContentDecision:
      type: object
      required: [action, actorId, actorName, createdAt]
      properties:
        action: { type: string, enum: [PUBLISH, REJECTED, CANCELLED] }
        actorId: { type: integer, nullable: true }
        actorName: { type: string, nullable: true, description: Current user name; null if unavailable. No private user fields are returned. }
        createdAt: { type: string, format: date-time, description: Persisted action time, not Instagram delivery time. }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        accessToken:
          type: string
          description: "JWT access token, expires in 15 minutes"
          example: "eyJhbGciOiJIUzI1NiIs..."
        refreshToken:
          type: string
          description: "JWT refresh token, expires in 7 days"
          example: "eyJhbGciOiJIUzI1NiIs..."

    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: "Budi Santoso" }
        email: { type: string, format: email, example: "budi@example.com" }
        photo: { type: string, nullable: true, example: "users/abc-123.jpg" }

    UpdatePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        oldPassword:
          type: string
          description: Required only if the account already has a password set
          example: "oldSecret123"
        newPassword: { type: string, minLength: 6, example: "newSecret123" }

    # --- User Schemas (response shape from UserSerializer, distinct from AuthUser) ---
    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 50 }
        perPage: { type: integer, example: 10 }
        currentPage: { type: integer, example: 1 }
        lastPage: { type: integer, example: 5 }
        from: { type: integer, example: 1, description: "First item index; 0 when the requested page is empty." }
        to: { type: integer, example: 10, description: "Last item index; 0 when the requested page is empty." }

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "John Doe" }
        photo: { type: string, nullable: true, example: "https://cdn.example.com/photo.jpg" }
        email: { type: string, format: email, example: "john@example.com" }
        isActive: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2026-06-01T08:00:00.000Z" }

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: "John Doe" }
        email: { type: string, format: email, example: "john@example.com" }
        password: { type: string, minLength: 6, example: "secret123" }
        photo: { type: string, nullable: true, example: "users/abc-123.jpg" }
        isActive: { type: boolean, default: true, example: true }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, example: "John Doe" }
        email: { type: string, format: email, example: "john@example.com" }
        password: { type: string, minLength: 6, example: "newSecret123" }
        photo: { type: string, nullable: true, example: "users/abc-123.jpg" }
        isActive: { type: boolean, example: true }

paths:
  /health:
    get:
      summary: Application database initialization status
      description: Reports initialization state, not a live dependency probe.
      servers:
        - url: /
      security: []
      responses:
        '200':
          description: Database initialized
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, uptime, environment, checks]
                properties:
                  status: { type: string, enum: [healthy, degraded] }
                  timestamp: { type: string, format: date-time }
                  uptime: { type: number }
                  environment: { type: string }
                  checks:
                    type: object
                    properties:
                      database: { type: string, enum: [connected, disconnected] }
        '503':
          description: Database not initialized

  /assets/{assetId}/previews:
    get:
      tags: [Content]
      summary: Get private thumbnail and preview URLs for progressive image loading
      description: Lazily creates a 32px JPEG thumbnail in the same private object-storage bucket. Existing assets need no migration. Archived or missing assets return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Standard success envelope containing expiring MinIO URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [previewUrl, thumbnailUrl]
                    properties:
                      previewUrl: { type: string, format: uri }
                      thumbnailUrl: { type: string, format: uri }
        '401':
          description: Authentication required
        '404':
          description: Asset unavailable
  /content/counts:
    get:
      tags: [Reporting]
      summary: Count Content tabs by job and current draft status
      description: Counts use the same date scope as Content lists and only the latest job attempt per batch. Superseded failed attempts are excluded. Completed jobs are represented by draft decision status, not counted twice as ready jobs.
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          description: Optional lookback in days. Omit to include all dates.
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: Status counts in the standard success envelope, including zero-count statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  message: { type: string }
                  data:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
        '401':
          description: Authentication required
        '422':
          description: Invalid query parameters
  # ── Login ─────────────────────────────────────────────────────────────────
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Content-Language: { $ref: "#/components/headers/ContentLanguage" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: User not registered, account inactive, or invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Google Login ──────────────────────────────────────────────────────────
  /auth/google:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with Google OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleLoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: User not registered or account inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Microsoft Login ───────────────────────────────────────────────────────
  /auth/microsoft:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with Microsoft OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicrosoftLoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: User not registered or account inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid Microsoft credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Forgot Password ──────────────────────────────────────────────────────
  /auth/forgot-password:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Request password reset email
      description: Each request or resend emails a new reset link valid for 10 hours. Previous links remain valid until expiry or a successful password reset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200":
          description: SMTP accepted the password reset email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Email not found or account inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

        "500":
          description: Email could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Validate Reset Token ─────────────────────────────────────────────────
  /auth/validate-reset-token:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Auth]
      summary: Validate a password reset token
      description: Requires an unexpired token matching the current email of an active account.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Missing email/token, or invalid/expired reset token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Reset Password ──────────────────────────────────────────────────────
  /auth/reset-password:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Reset password with token
      description: Changes the password and deletes all reset tokens for this user atomically. Other users are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Refresh Token ────────────────────────────────────────────────────────
  /auth/refresh:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Invalid or expired refresh token, or account inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Me ───────────────────────────────────────────────────────────────────
  /auth/me:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthUser" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/profile:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    put:
      tags: [Auth]
      summary: Update current user's profile details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthUser" }
        "400":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/password:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    put:
      tags: [Auth]
      summary: Update current user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasswordRequest" }
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Invalid old password, or old password required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

