          description: Validation error
        "429":
          description: Mutation rate limit
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: Default N8N_CONTRACT=legacy requires snake_case; camelCase accepted only when configured. Service bearer is distinct from user JWT.
      requestBody:
        required: true
        content:
