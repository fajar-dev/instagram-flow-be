  /upload:
    post:
      tags: [Upload]
      summary: Upload a file to MinIO
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Static JPG, PNG or WEBP image, validated by decoded bytes. Size limit follows MAX_UPLOAD_MB; stored as sanitized JPEG.
      responses:
        "413":
          description: Request exceeds upload body limit
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
