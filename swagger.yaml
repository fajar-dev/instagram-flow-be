  "/jobs/{jobId}":
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags:
        - AI Jobs
      summary: "Job with immutable AI result, current draft, history and render metadata"
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Job detail including persisted publishing/rejection actors; publish is the request action, not delivery confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      draft:
                        type: object
                        nullable: true
                        properties:
                          decisionStatus: { type: string, enum: [READY_FOR_REVIEW, PUBLISH, REJECTED] }
                      rejections:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            draftId: { type: string, format: uuid }
                            rejectedBy: { type: integer }
                            notes: { type: string }
                            contentHash: { type: string }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                      uploader:
                        type: object
                        required: [id, name]
                        properties:
                          id: { type: integer }
                          name: { type: string, nullable: true }
                      decisions:
                        type: array
                        items:
                          $ref: "#/components/schemas/ContentDecision"
        "400":
          description: Invalid request or unsupported image/render
        "401":
          description: Authentication or signature invalid
        "404":
          description: Resource absent or outside owner scope
        "409":
          description: "State, execution, idempotency or content conflict"
        "422":
          description: Validation error
        "429":
          description: Mutation rate limit
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  "/jobs/{jobId}/result":
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags:
        - AI Jobs
      summary: Job result and content
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Job detail including persisted publishing/rejection actors; publish is the request action, not delivery confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      draft:
                        type: object
                        nullable: true
                        properties:
                          decisionStatus: { type: string, enum: [READY_FOR_REVIEW, PUBLISH, REJECTED] }
                      rejections:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            draftId: { type: string, format: uuid }
                            rejectedBy: { type: integer }
                            notes: { type: string }
                            contentHash: { type: string }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                      uploader:
                        type: object
                        required: [id, name]
                        properties:
                          id: { type: integer }
                          name: { type: string, nullable: true }
                      decisions:
                        type: array
                        items:
                          $ref: "#/components/schemas/ContentDecision"
        "400":
          description: Invalid request or unsupported image/render
        "401":
          description: Authentication or signature invalid
        "404":
          description: Resource absent or outside owner scope
        "409":
          description: "State, execution, idempotency or content conflict"
        "422":
          description: Validation error
        "429":
          description: Mutation rate limit
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
    post:
      tags:
        - AI Jobs
      summary: "Atomically persist immutable AI result, render, draft and content"
      description: >-
        When Telegram is configured, the same transaction enqueues one ready-for-review
        notification per job. Delivery runs asynchronously in jobs:dispatch; a repeated
        identical callback does not enqueue another message. Telegram delivery failure
        does not change the accepted content result. No Telegram credentials are exposed.
        Integration requests and responses use camelCase. Service bearer is distinct from user JWT.
      security:
        - n8nServiceAuth:
            []
      responses:
        "200":
          description: Flat n8n response; see backend/docs/IMPLEMENTATION.md
        "400":
          description: Invalid request or unsupported image/render
        "401":
          description: Authentication or signature invalid
        "404":
          description: Resource absent or outside owner scope
        "409":
          description: "State, execution, idempotency or content conflict"
        "422":
          description: Validation error
        "429":
          description: Mutation rate limit
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    jobId:
                      type: string
                      format: uuid
                      pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                    executionId:
                      type: string
                      pattern: "^[a-zA-Z0-9_-]{1,128}$"
                    resultVersion:
                      type: integer
                      minimum: 1
                      maximum: 1000
                    status:
                      type: string
                      enum:
                        - READY_FOR_REVIEW
                    selectedAssetIds:
                      minItems: 1
                      maxItems: 5
                      type: array
                      items:
                        type: string
                        format: uuid
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                    rankings:
                      minItems: 1
                      maxItems: 30
                      type: array
                      items:
                        type: object
                        properties:
                          assetId:
                            type: string
                            format: uuid
                            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                          score:
                            type: number
                            minimum: 0
                            maximum: 100
                          reason:
                            type: string
                            maxLength: 2000
                        required:
                          - assetId
                          - score
                          - reason
                        additionalProperties:
                          {}
                    title:
                      type: string
                      minLength: 1
                      maxLength: 300
                    caption:
                      type: string
                      description: Nonempty for Feed; empty for Story (with empty hashtags).
                      maxLength: 10000
                    hashtags:
                      maxItems: 30
                      type: array
                      items:
                        type: string
                        maxLength: 100
                    renders:
                      description: One AI image per uploaded Feed photo (up to 19); exactly one for Story.
                      minItems: 1
                      maxItems: 19
                      type: array
                      items:
                        type: object
                        properties:
                          placement:
                            type: string
                            enum:
                              - feed
                              - story
                          format:
                            type: string
                            enum:
                              - jpeg
                          width:
                            type: number
                            enum:
                              - 1080
                          height:
                            anyOf:
                              - type: number
                                enum:
                                  - 1350
                              - type: number
                                enum:
                                  - 1920
                          imageBase64:
                            type: string
                            maxLength: 16777216
                            minLength: 4
                            pattern: "^[A-Za-z0-9+/]+={0,2}$"
                          assetId:
                            type: string
                            format: uuid
                            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                        required:
                          - placement
                          - format
                          - width
                          - height
                          - imageBase64
                          - assetId
                        additionalProperties: false
                  required:
                    - jobId
                    - executionId
                    - resultVersion
                    - status
                    - selectedAssetIds
                    - rankings
                    - title
                    - caption
                    - hashtags
                    - renders
                  additionalProperties: false
                - type: object
                  properties:
                    jobId:
                      type: string
                      format: uuid
