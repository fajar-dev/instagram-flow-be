  /instagram/accounts/{accountKey}/insights:
    get:
      tags: [Instagram]
      summary: Read account insights over a Jakarta calendar period
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: accountKey
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, this_week, this_month]
            default: this_week
          description: Asia/Jakarta calendar boundaries; weeks begin Monday. All ranges end at the time of retrieval.
      responses:
        '502':
          description: Instagram upstream request failed
        '403':
          description: Media does not belong to the configured account
        "200":
          description: Data uses a five-minute shared Redis cache. Unavailable metrics return null. Media metrics are lifetime totals; account period does not filter the media list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InsightReport'
        "400":
          description: Account unavailable, insight access failed, or publication not published
        "401":
          description: Authentication required
        "404":
          description: Publication not found
        "422":
          description: Invalid query

  /instagram/accounts/{accountKey}/top-posts:
    get:
      tags: [Instagram]
      summary: Read a cursor page of Feed/Reels insights ranked by lifetime interactions, then reach
      security:
        - bearerAuth: []
      parameters:
        - name: accountKey
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from the previous page.
      responses:
        '502':
          description: Instagram upstream request failed
        '403':
          description: Media does not belong to the configured account
        "200":
          description: Five-minute cache. Independent of account date range. Missing interaction metrics are retained last; provider failures fail the request rather than return an incomplete ranking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        maxItems: 20
                        items:
                          $ref: '#/components/schemas/InsightReport'
                      sampled:
                        type: integer
                      unavailable:
                        type: integer
                      limit:
                        type: integer
                        enum: [20]
                      after:
                        type: string
                        nullable: true
                      fetchedAt:
                        type: string
                        format: date-time
        "400":
          description: Account or insights unavailable
        "401":
          description: Authentication required

