services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hono-be
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hono-be-network

  db:
    image: mysql:8.4
    container_name: hono-be-db
    restart: always
    environment:
      - MYSQL_USER=${DB_USER:-hono}
      - MYSQL_PASSWORD=${DB_PASS:-hono}
      - MYSQL_DATABASE=${DB_NAME:-hono_be}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 5
    networks:
      - hono-be-network

networks:
  hono-be-network:
    driver: bridge

volumes:
  mysql_data:
