services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hono-be
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - ENV=${ENV:-production}
      - APP_URL=${APP_URL}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-hono}
      - DB_PASS=${DB_PASS:-hono}
      - DB_NAME=${DB_NAME:-hono_be}
      - DB_SYNC=false
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - API_KEY=${API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-hono-be}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hono-be-network

  db:
    image: mysql:8.4
    container_name: hono-be-db
    restart: always
    environment:
      - MYSQL_USER=${DB_USER:-hono}
      - MYSQL_PASSWORD=${DB_PASS:-hono}
      - MYSQL_DATABASE=${DB_NAME:-hono_be}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 5
    networks:
      - hono-be-network

networks:
  hono-be-network:
    driver: bridge

volumes:
  mysql_data:
